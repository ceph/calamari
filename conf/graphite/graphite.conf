Listen 8080
<VirtualHost *:8080>
        ServerName graphite-web
        DocumentRoot "/opt/graphite/webapp"
        WSGIScriptAlias / /opt/graphite/conf/graphite.wsgi
        ErrorLog /var/log/httpd/graphite.error_log
        CustomLog /var/log/httpd/graphite.access_log common
        <Directory /opt/graphite/conf/>
                Order deny,allow
                Allow from all
        </Directory>
        Header set Access-Control-Allow-Origin "*"
</VirtualHost>

